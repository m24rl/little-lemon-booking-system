{% extends 'base.html' %}
{% block content %}
<section><article>
  <h1>Make a reservation</h1>
  <div class="row">
    <div class="column">
      <form method="POST" id="form">
        {% csrf_token %}
        <p><label for="first_name">First name:</label><input type="text" name="first_name" id="first_name" maxlength="200" required></p>
        <p><label for="reservation_date">Reservation date:</label><input type="date" name="reservation_date" id="reservation_date" required></p>
        <p><label for="reservation_slot">Reservation slot:</label><select name="reservation_slot" id="reservation_slot" required></select></p>
        <button type="submit" id="button">Reserve</button>
        <p id="message" role="status"></p>
      </form>
    </div>
    <div class="column"><h2>Bookings for <span id="today"></span></h2><div id="bookings" aria-live="polite"></div></div>
  </div>
</article></section>
<script>
const dateInput = document.getElementById('reservation_date');
const slots = document.getElementById('reservation_slot');
const message = document.getElementById('message');
const now = new Date();
dateInput.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const formatTime = hour => `${hour > 12 ? hour - 12 : hour} ${hour < 12 ? 'AM' : 'PM'}`;
let loadNumber = 0;
async function getBookings() {
  const currentLoad = ++loadNumber;
  const selectedDate = dateInput.value;
  document.getElementById('today').textContent = selectedDate;
  slots.disabled = true;
  try {
    const response = await fetch("{% url 'bookings' %}?date=" + encodeURIComponent(selectedDate));
    if (!response.ok) throw new Error('Unable to load reservations.');
    const data = await response.json();
    if (currentLoad !== loadNumber) return;
    const occupied = new Set(data.map(item => item.fields.reservation_slot));
    const list = document.getElementById('bookings');
    list.replaceChildren();
    for (const item of data) {
      const row = document.createElement('p');
      row.textContent = `${item.fields.first_name} - ${formatTime(item.fields.reservation_slot)}`;
      list.appendChild(row);
    }
    if (!data.length) list.textContent = 'No bookings';
    slots.replaceChildren();
    for (let hour = 10; hour <= 19; hour++) {
      const option = new Option(formatTime(hour), hour);
      option.disabled = occupied.has(hour);
      slots.appendChild(option);
    }
    const firstFree = [...slots.options].find(option => !option.disabled);
    slots.value = firstFree ? firstFree.value : '';
    slots.disabled = !firstFree;
    document.getElementById('button').disabled = !firstFree;
  } catch (error) { message.textContent = error.message; }
}
dateInput.addEventListener('change', () => {message.textContent = ''; getBookings();});
document.getElementById('form').addEventListener('submit', async event => {
  event.preventDefault();
  if (!event.target.reportValidity()) return;
  document.getElementById('button').disabled = true;
  try {
    const response = await fetch("{% url 'bookings' %}", {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-CSRFToken':event.target.querySelector('[name=csrfmiddlewaretoken]').value},
      body: JSON.stringify({first_name:document.getElementById('first_name').value, reservation_date:dateInput.value, reservation_slot:slots.value})
    });
    const data = await response.json();
    message.textContent = response.ok ? 'Reservation confirmed.' : (data.error || 'Please check your details; the slot may already be booked.');
  } catch (error) { message.textContent = 'Unable to save reservation. Please try again.'; }
  await getBookings();
});
getBookings();
</script>
{% endblock %}
